[package]
name = "CONV"
version = "0.1.0"
edition = "2021"

[dependencies]
serenity = { version = "0.12.5", default-features = false, features = ["client", "gateway", "rustls_backend", "model", "collector", "http"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "process"] }
dotenv = "0.15.0"
log = "0.4.22"
image = "0.25.5"
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls"] }
tempfile = "3.15.0"